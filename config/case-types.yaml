      label: "Application"
      stages:
        - { key: started, label: "Started", due_hours: 168, customer_visible: true }
        - { key: documents_outstanding, label: "Documents outstanding", due_hours: 168, customer_visible: true }
        - { key: under_review, label: "Under review", due_hours: 336, customer_visible: true }
        - { key: offer_made, label: "Offer made", due_hours: 336, customer_visible: true }
        - { key: enrolled, label: "Enrolled", terminal: true, customer_visible: true }
  I:
    - id: tenancy
      label: "Tenancy"
      stages:
        - { key: viewing, label: "Viewing", due_hours: 72, customer_visible: true }
        - { key: offer, label: "Offer", due_hours: 72, customer_visible: true }
        - { key: referencing, label: "Referencing", due_hours: 168, customer_visible: true }
        - { key: signed, label: "Signed", customer_visible: true }
