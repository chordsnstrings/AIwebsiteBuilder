# Setup & activation fees, MRR, addon prices and discount floors per region
# (spec §44). PR-gated. Sensitive change class. Discount floors are clamped in
# code after the Finance model returns — never instructed in a prompt.
#
# ⛔ `setup_fee_cents` is the AGENT SETUP AND ACTIVATION fee. It is never a
# website fee and must never be described as one. The website is included and
# costs us cents; the market prices that at $16/month and 92–98% already have
# one, so a website setup fee cannot be defended. What is being charged for is
# real and nobody else does it: extracting a knowledge base with provenance per
# fact, generating and binding the Q&A pack, running the per-customer eval gate,
# connecting a calendar, and publishing the machine-facing surface.
R1:
  setup_fee_cents: 39900   # agent setup & activation
  mrr_cents: 6500
  discount_floor_pct: 0.15
  annual_discount_pct: 0.16
  addons:
    receptionist: { cents: 4900, target_attach: 0.25 }
    seo: { cents: 9900, target_attach: 0.12 }
    booking: { cents: 1900, target_attach: 0.20 }
    voice: { cents: 9900, target_attach: 0.10 }      # metered; materially higher cost
    b2b_leads: { cents: 14900, target_attach: 0.08 }

