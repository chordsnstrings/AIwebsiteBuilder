    unsubscribe: "You received this because your business is publicly listed. Unsubscribe: {unsub_url}"
    ai_disclosure: "This message was drafted with the help of AI. Reply STOP to opt out."
    preview_disclaimer: "Unofficial preview created by {entity} — not affiliated with this business."
    guarantee: "30-day money-back guarantee. You pay nothing until you approve this. Reply REFUND within 30 days for a full refund."
  en-GB:
    unsubscribe: "You received this as a corporate subscriber. Unsubscribe: {unsub_url}"
    ai_disclosure: "This message was drafted with the help of AI. Reply STOP to opt out."
    preview_disclaimer: "Unofficial preview created by {entity} — not affiliated with this business."
    guarantee: "30-day money-back guarantee. You pay nothing until you approve this."
  en-AU:
