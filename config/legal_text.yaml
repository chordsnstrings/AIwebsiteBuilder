# Legal text blocks per jurisdiction (spec §60.1). NEVER model-generated.
# Sensitive change class. {entity}, {address}, {unsub_url}, {privacy_url} are
# substituted deterministically at send time.
default:
  entity: "ADW Foundry Ltd"
  postal_address: "123 Example Street, Suite 400, Toronto, ON M5V 0A1, Canada"
  privacy_url: "https://adw.example/privacy"

blocks:
