  # plumber working in the house. Generated per-vertical; widened by hand after
  # the test suite showed a nursery had no safeguarding protocol at all.
  - id: safeguarding_disclosure
    label: "Safeguarding disclosure"
    severity: 1
    safety_critical: true
    verticals: ['*']
    detection: automatic
    triggers:
      - "safeguarding"
      - "child protection"
      - "\\b(hit|hits|hitting|beat|beats|beating|hurt|hurts|hurting|smack\\w*|punch\\w*|kick\\w*)\\b[^.?!]{0,15}\\b(me|him|her|them|us)\\b"
      - "\\b(abus\\w+|molest\\w+|groom\\w+)\\b"
      # "don't feel safe at home" contains no literal "not safe". Match the
      # negation and the word, not the phrase someone would write in a report.
      - "(not|n.t)\\s+(feel\\w*\\s+)?safe\\b"
      - "\\btouch\\w*\\b[^.?!]{0,25}\\b(inappropriate\\w*|private|down there)\\b"
      - "\\bscared (of|to go)\\b[^.?!]{0,25}\\b(home|him|her|them|dad|mum|mom|stepdad|stepmum)\\b"
      - "\\bsomeone is hurting\\b"
    interlocks: [no_advice, no_booking, no_disclosure, no_further_agent_contact, no_further_questions, no_triage, verbatim_only]
    capture: "Verbatim capture routed to the lead only"
    stays_human: "Everything"
    escalation:
      - { after_minutes: 0,  notify: designated_lead }
      - { after_minutes: 15, notify: owner }
      - { after_minutes: 60, notify: operator }

