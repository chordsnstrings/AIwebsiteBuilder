# Protocol & incident playbooks (catalogue MF14 — 141 units, 34 safety-critical).
#
# ⛔ Restricted change class. A protocol here is a promise about what the agent
# will do when something has gone wrong, and editing one is a pull request with
# a human reviewer, never a runtime decision.
#
# The shape of every unit in this family is the same and the runtime encodes it:
#
#     trigger  →  fixed response  →  interlocks  →  evidence capture  →  clock
#
# Four rules the loader enforces rather than trusting:
#
#   1. Detection is DETERMINISTIC. Patterns, never a model. A classifier that
#      misses a gas smell one time in a hundred is not an acceptable component,
#      and "the model usually gets it" is not a safety argument.
#   2. `detection: manual` is honest and common. 121 of these cannot be spotted
#      from a chat message — they start with a phone call, a sensor or a letter.
#      Writing a pattern nobody believes in would be worse than admitting it.
#   3. Interlocks come from the closed set below. An unknown name FAILS THE
#      LOAD, because a typo must never silently disable a safety constraint.
#   4. `verticals: []` means catalogued but not active — the unit belongs to a
#      vertical this deployment does not serve. It is kept so the gap is
#      visible rather than forgotten.

version: 1

# ---------------------------------------------------------------------------
# Interlocks — what the agent must STOP doing once a protocol fires.
# ---------------------------------------------------------------------------
interlocks:
  no_triage: "Never assess how serious, urgent or dangerous the situation is. Recognising the trigger is the whole of the agent's judgement."
  no_advice: "Never advise, diagnose, reassure, or suggest a remedy \u2014 including 'you'll be fine' and 'it's probably nothing'."
  no_further_questions: "Stop asking. Capture what was said and route it; questions after a disclosure are re-traumatising and contaminate a record."
  no_liability: "Never admit, deny, apportion or speculate about fault, cause or cover."
  no_booking: "Do not offer, hold, move or confirm an appointment on this turn."
  no_pricing: "Do not quote, estimate or discuss cost."
  no_auto_resume: "Whatever this paused may only be restarted by a named human, never by a timer and never by the visitor asking again."
  verbatim_only: "Record the person's own words exactly. Never summarise, paraphrase, correct or tidy them."
  no_disclosure: "Do not tell the visitor who this was routed to, or that it was escalated at all."
  no_further_agent_contact: "Send nothing further to this person from the agent \u2014 no follow-up, no sequence, no review request."

# ---------------------------------------------------------------------------
# Who gets told, in order. Resolved to real people per customer at run time.
# ---------------------------------------------------------------------------
notify_roles:
  designated_lead: "The person named for this protocol class (safeguarding lead, DPO, site manager)."
  owner: "The business owner."
  operator: "ADW's on-call operator. Reached only when the business has not acknowledged."

