# Role definitions, candidate pools, eval suites, cadences (spec §11.3, §69).
# Restricted change class. Champions are NOT set here — they are written by the
# eval harness with a stored eval run. Seed values from the financial model's
# LLM_Routing tab are candidate/escalation *pools*, not champion assertions.
rails:
  primary: modelark
  fallback: google
  pinned:
    ceo: "anthropic/opus-5"
    sentinel: "anthropic/opus-5"

roles:
  enrichment:
    candidates: ["modelark/seed-2-0-mini", "modelark/seed-2-0-lite", "google/gemini-flash-lite", "modelark/deepseek-v4-flash"]
    escalation: ["modelark/seed-2-0-lite", "google/gemini-flash-lite"]
    selection_metric: cost_per_pass
    re_eval_cadence: monthly
    data_class: PUB
    eval_suite: enrichment
  site_scoring:
    candidates: ["modelark/seed-2-0-lite", "modelark/seed-2-1-pro", "google/gemini-3-1-pro", "modelark/seed-2-0-pro"]
    escalation: ["modelark/seed-2-1-pro", "google/gemini-3-1-pro"]
    selection_metric: cost_per_pass
    re_eval_cadence: monthly
    data_class: PUB
    eval_suite: site_scoring
  preview_gen:
