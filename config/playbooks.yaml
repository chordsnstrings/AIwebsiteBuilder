# Vertical playbooks (software documentation §43). Config, not code.
#
# Change class: SENSITIVE — PR + compliance owner. The refusal sets in here are
# the difference between an agent that protects a customer and one that creates
# a regulatory problem for them, and the Architect may only CLASSIFY against
# this file. A capability the model proposes that is not listed here fails the
# build; it does not become a runtime decision.
#
# Ordered by the MEASURED booking gap. The lower the coverage, the better the
# opportunity — a vertical above 40% is already owned by vertical SaaS and the
# gap we sell against does not exist there.
version: 1
reviewed_by: "Counsel — Rivera & Osei LLP"
reviewed_at: "2026-07-28"

# ⛔ MUST NOT launch into a vertical whose booking coverage exceeds this.
max_booking_coverage: 0.40

# Refusals every vertical inherits. Never assert a licence, certification,
# insurance, award or accreditation absent from the knowledge base — even where
# inference seems reasonable.
universal_refusals:
  - id: unverified_credential
    matches: [licence, license, certified, certification, insured, insurance, accredited, accreditation, award]
    reason: "Not in the knowledge base as a verified fact"
  - id: unpublished_price
    matches: [price, cost, quote, "how much", charge]
    reason: "Only prices the business has published may be stated"
  - id: competitor_comparison
    matches: [better than, cheaper than, versus, compared to]
    reason: "Never comment on a named competitor"
  - id: payment_in_conversation
    matches: [card number, bank details, account number, sort code, routing number]
    reason: "Payment happens through a link, never in conversation"

verticals:
  roofing:
    label: "Roofing"
    booking_coverage: 0.000
    booking_model: quote_request
    photo_triage: true
    pricing: never_published
    event_triggers: [storm, high_wind]
    integrations: [xero_qbo, stripe]
    site_modules: [hero, services, service_area, gallery, about, emergency, contact]
    agent_capabilities: [answer, capture_enquiry, photo_triage, escalate, mcp]
    dashboard_panels: [enquiries, gap_list, photo_queue, reviews, value_report, dns_diff]
    refusals:
      - id: trade_certification
        matches: [gas safe, niceic, part p, asbestos, working at height]
        reason: "Trade certification claims are never asserted without a verified fact"
      - id: arrival_guarantee
        matches: [guaranteed arrival, be there in, within the hour]
        reason: "Never guarantee an arrival time"
      - id: photo_price
        matches: [from this photo, based on the picture]
        reason: "The agent never prices from a photo — the owner does"

  accountant:
    label: "Accountant"
    booking_coverage: 0.067
    booking_model: consultation_slot
    photo_triage: false
    pricing: fee_structure_only
    event_triggers: [tax_deadline]
    integrations: [calendar, esign]
    site_modules: [hero, services, credentials, about, contact]
    agent_capabilities: [answer, capture_enquiry, book, escalate, mcp]
    dashboard_panels: [enquiries, bookings, gap_list, reviews, value_report, dns_diff]
    refusals:
      - id: tax_advice
        matches: [should i claim, can i deduct, will i owe, tax advice]
        reason: "Never give tax advice — this is regulated"
      - id: outcome_prediction
        matches: [you will get, guaranteed refund, will save you]
        reason: "Never predict an outcome"

  lawyer:
    label: "Lawyer"
    booking_coverage: 0.095
    booking_model: consultation_slot
    photo_triage: false
    pricing: never_published
    event_triggers: [filing_date]
    integrations: [calendar, esign]
    site_modules: [hero, services, credentials, about, contact]
    agent_capabilities: [answer, capture_enquiry, book, escalate, mcp]
    dashboard_panels: [enquiries, bookings, gap_list, reviews, value_report, dns_diff]
    refusals:
      - id: legal_advice
        matches: [do i have a case, should i sue, am i liable, legal advice]
        reason: "Never give legal advice — this is regulated"
      - id: case_outcome
        matches: [we will win, you will win, guaranteed outcome]
        reason: "Never predict a case outcome"
      - id: fee_quote
        matches: [how much will it cost, what are your fees]
        reason: "Fees are never published for this vertical"

  pest_control:
    label: "Pest control"
    booking_coverage: 0.133
    booking_model: callout_request
    photo_triage: true
    pricing: callout_fee
    event_triggers: [seasonal_infestation]
