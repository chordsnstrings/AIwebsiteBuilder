  cleaning:
    label: "Cleaning"
    booking_coverage: 0.417
    booking_model: instant_book
    photo_triage: false
    pricing: per_hour_or_room
    event_triggers: []
    integrations: [booking, stripe]
    site_modules: [hero, services, service_area, about, contact]
    agent_capabilities: [answer, capture_enquiry, book, escalate, mcp]
    dashboard_panels: [enquiries, bookings, gap_list, reviews, value_report, dns_diff]
    refusals: []

# ⛔ Prohibited. Vertical SaaS already owns the booking layer; the transactability
# gap we sell against does not exist here. Listed rather than omitted so the
# Architect refuses explicitly instead of falling through to a default.
prohibited:
  dentist:
    label: "Dentist"
    booking_coverage: 0.500
    reason: "Dental practice-management software owns booking"
  hair_salon:
    label: "Hair salon"
    booking_coverage: 0.818
    reason: "Fresha and Booksy own booking"

# Modifiers reshape the baseline. Detected, never assumed.
modifiers:
  emergency_service:
    detect: ["24/7", "24 hour", emergency, "call out", callout]
    effects: { adds_modules: [emergency], agent_capabilities: [urgency_triage], escalation: sms }
  multi_location:
    detect_field: gbp_location_count_gt_1
    effects: { adds_modules: [location_picker], booking: routes_by_branch }
  franchise:
    detect_field: franchise_register_match
    effects: { escalate: true, reason: "Brand assets and copy are centrally controlled" }
  regulated_trade:
    detect: [gas, electrical, asbestos, medical, legal, financial]
    effects: { ip_screen: mandatory, refusals: hard }
  no_published_pricing:
    detect_field: site_audit_pricing_found_false
    effects: { removes_modules: [pricing], booking: quote_request_only }
  appointment_based:
    detect_field: site_audit_booking_found_true
    effects: { booking: instant_book, integrations_priority: [calendar] }
  seasonal:
    detect_field: review_volume_variance_gt_2x
    effects: { event_triggers: enabled }
  b2b_serving:
    detect: [companies, contracts, offices, commercial, "b2b"]
    effects: { adds_panels: [b2b_leads], qa_topics: [invoice_terms] }
  thin_content:
    detect_field: pages_lt_5_or_words_lt_400
    effects: { qa_pack: vertical_template_fallback, onboarding: extended }

# Escalate rather than guess.
escalation:
  min_confidence: 0.75
  target_rate_max: 0.06     # above this the playbooks are too narrow

# Retrieval thresholds (§39.1). ⛔ Start high and lower with evidence — a
# confidently wrong answer is worse than an admission of ignorance, and it is
# the customer's liability, not ours.
retrieval:
  verbatim_min: 0.82        # return the stored answer as written
  hedged_min: 0.65          # return it with a hedge + offer the owner
  # below hedged_min → miss → fallback, and log the exact question as a gap
  hit_rate_target_launch: 0.80
  hit_rate_target_m3: 0.93
  rrf_k: 60                 # reciprocal-rank fusion constant
  vector_weight: 1.0
  bm25_weight: 1.0

# The per-customer agent eval gate (§47.2). ⛔ No partial credit.
agent_eval:
  grounded_cases: 20        # questions from their own published content
  refusal_cases: 10         # questions outside the KB — refused without improvising
  pass_requires: all
  min_pack_pairs: 40        # below this, flag thin and extend onboarding
  target_pack_pairs: 150
