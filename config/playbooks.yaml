    integrations: [xero_qbo, stripe]
    site_modules: [hero, services, service_area, gallery, about, contact]
    agent_capabilities: [answer, capture_enquiry, photo_triage, escalate, mcp]
    dashboard_panels: [enquiries, gap_list, photo_queue, reviews, value_report, dns_diff]
    refusals: []

  electrician:
    label: "Electrician"
    booking_coverage: 0.154
    booking_model: callout_request
    photo_triage: true
    pricing: callout_plus_hourly
    event_triggers: []
    integrations: [xero_qbo, stripe]
    site_modules: [hero, services, service_area, about, emergency, contact]
    agent_capabilities: [answer, capture_enquiry, photo_triage, escalate, mcp]
    dashboard_panels: [enquiries, gap_list, photo_queue, reviews, value_report, dns_diff]
