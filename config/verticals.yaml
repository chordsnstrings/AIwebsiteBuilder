# The canonical vertical taxonomy — all 60 clusters from the master catalogue.
#
# ⛔ ONE source. Before this file the taxonomy lived in five places (playbooks,
# design-catalogue, SITE_VERTICALS, the Architect's category map, protocols),
# each listing a different subset of nine SMB trades, and every one of them
# would have had to be edited to add a vertical. Everything now derives from
# here.
#
# Two levels, because the catalogue and the code are at different grains:
#
#   CLUSTER  what the catalogue calls a vertical — "Emergency home services".
#            60 of them, each carrying an archetype and a segment.
#   TRADE    what a business actually is — "plumber". This is what a customer
#            record holds, what a design is chosen for, and what a protocol is
#            scoped to. The nine ids that predate this file are unchanged; they
#            are sub-verticals of a cluster, not competitors to it.
#
# Archetypes (A–J) are the load-bearing key. The catalogue collapses 60 → 10 → 14
# engines, and so does this system: design, register and playbook defaults are
# chosen per ARCHETYPE, with per-trade overrides where a trade genuinely differs.
# Sixty hand-written design rows would be sixty things to keep in sync.

version: 1

archetypes:
  A: emergency_trades
  B: booked_personal_services
  C: regulated_professions
  D: project_trades
  E: recurring_b2b
  F: hospitality_venues
  G: clinical_health
  H: education_training
  I: property_lettings
  J: retail_product_led

# ---------------------------------------------------------------------------
# What lead-data vendors actually call these businesses.
#
# ⛔ Synonyms only. Morphological variants — roofer/roofing, plumber/plumbing,
# landscaper/landscaping — are handled by stemming in the resolver and must NOT
# be listed here; a list that has to enumerate every ending is a list that will
# be missing one. These are the words that share no stem with the trade id.
# ---------------------------------------------------------------------------
aliases:
  auto_repair: [mechanic, garage, "car repair", "auto shop", "vehicle repair", "mot centre", "mot center"]
  lawyer: [solicitor, attorney, "law firm", advocate, barrister, "legal services"]
  accountant: [bookkeeper, cpa, "chartered accountant", "tax preparer"]
  hvac: [aircon, "air conditioning", "heating and cooling", hvacr, furnace]
  pest_control: [exterminator, "pest removal", fumigation]
  cleaning: [cleaner, housekeeping, janitorial, "maid service"]
  dentist: [dental, orthodontist, "dental practice", "dental surgery"]
  physiotherapy: [physio, physiotherapist]
  veterinary: [vet, "vet clinic", "animal hospital"]
  estate_agent: [realtor, "real estate agent", "property agent"]
  hair_salon: [hairdresser, "hair stylist", coiffure]
  gym: ["fitness centre", "fitness center", "health club"]
  restaurant: [eatery, bistro, diner, "food service"]
  personal_trainer: ["pt studio", "fitness coach"]
  it_msp: ["managed service provider", "it support", "it services"]
  freight_forwarder: [logistics, "customs broker", shipping]
  saas_and_software: [software, saas, "software company"]
  telecom: [carrier, mvno, isp, "internet service provider"]

clusters:
