    layouts: [hero-services-about-contact, hero-gallery-contact]
    locales: [en-US, en-GB, en-AU]
    color_systems: 6
    type_pairings: 4
  personal_services:
    layouts: [hero-services-about-contact, hero-gallery-contact]
    locales: [en-US, en-GB, en-AU]
    color_systems: 6
    type_pairings: 4
